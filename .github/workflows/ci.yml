name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

env:
  CI: 'true'
  E2E_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lsof zsh

      - name: Install pnpm
        run: npm install --global pnpm@11.1.3

      - name: Install Rust tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt
          cargo install cargo-audit --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all checks
        run: make check

  linux-bundle:
    name: Linux bundle
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf wget

      - name: Install pnpm
        run: npm install --global pnpm@11.1.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux bundle
        run: make bundle
