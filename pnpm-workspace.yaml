packages:
  - apps/*

# Only these packages may run install scripts.
allowBuilds:
  esbuild: true

# Versions must be public for 2 days before install (supply-chain safety).
minimumReleaseAge: 2880

auditConfig:
  ignoreGhsas:
    # minimatch <11.0.1 (ReDoS via glob patterns): only ESLint uses it, with the
    # repo's own patterns, and it is not shipped. No 10.x fix and ESLint needs
    # ^10.2.6; remove once ESLint accepts minimatch 11.
    - GHSA-g3hv-75wg-m249
    # picomatch <=4.0.7 (ReDoS): only typescript-eslint / tinyglobby uses it at
    # dev time, and it is not shipped. No patched version exists yet.
    - GHSA-fc5q-39xc-vjpf

patchedDependencies:
  # Backport of xterm.js WebGL shared-atlas fixes (2b982bc3, #6042, #6055 and
  # monotonic page versions): splits sharing the glyph atlas showed garbled
  # text after long use. Remove when a stable addon-webgl ships them (0.20).
  '@xterm/addon-webgl@0.19.0': patches/@xterm__addon-webgl@0.19.0.patch
